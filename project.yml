name: SOBATOVSKY-OS
options:
  bundleIdPrefix: com.sobatovsky
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  SOBATOVSKY-OS:
    type: application
    platform: iOS
    sources:
      - path: SOBATOVSKY-OS
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: SOBATOVSKY OS
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sobatovsky.productivity
        PRODUCT_NAME: SOBATOVSKY-OS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  SOBATOVSKY-OSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SOBATOVSKY-OSTests
    dependencies:
      - target: SOBATOVSKY-OS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sobatovsky.productivity.tests
schemes:
  SOBATOVSKY-OS:
    build:
      targets:
        SOBATOVSKY-OS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SOBATOVSKY-OSTests
    profile:
      config: Release
    archive:
      config: Release
